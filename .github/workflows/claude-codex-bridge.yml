name: Claude Code bridge for Codex

# Owner-controlled: manual @claude requests or a single read-only follow-up
# on a Codex review containing concrete findings. No push-based bot loop.
on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude-on-demand:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'Kerberone' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Confirm owned branch before providing credentials
        id: trust
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          info=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          head_repo=$(jq -r '.head.repo.full_name' <<< "$info")
          pr_author=$(jq -r '.user.login' <<< "$info")
          if [[ "$head_repo" == "$GITHUB_REPOSITORY" && "$pr_author" == "Kerberone" ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR branch/author not permitted; skipping Claude."
            echo "trusted=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run Claude for owner request
        if: steps.trust.outputs.trusted == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 12
            --append-system-prompt "Work only on this PR branch. Follow AGENTS.md. Never push or merge nx2, never merge a pull request, never disclose credentials or proprietary assets, never trigger @codex or @claude yourself. Keep changes focused; explain testing limitations. Respond to the owner in English with a short Italian summary."

  codex-followup:
    # Only one Codex review-submission event. Review comments and Claude's own
    # replies do not trigger this job, avoiding ping-pong.
    if: >-
      github.event_name == 'pull_request_review' &&
      (github.event.review.user.login == 'chatgpt-codex-connector' ||
       github.event.review.user.login == 'chatgpt-codex-connector[bot]') &&
      contains(github.event.review.body, 'codex-review-receipt:v1') &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.user.login == 'Kerberone' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Read-only Claude triage for Codex findings
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "chatgpt-codex-connector[bot],chatgpt-codex-connector"
          track_progress: true
          prompt: |
            Lichii repository: ${{ github.repository }}
            PR number: ${{ github.event.pull_request.number }}
            Codex review commit: ${{ github.event.review.commit_id }}
            Inspect the newest Codex inline review findings on this PR.
            Evaluate each finding against the actual code. Explain which issues
            are confirmed, which need evidence, and the minimal safe fix/test.
            In this automatic follow-up, do NOT edit files, push commits, merge,
            approve PRs, or invoke other agents. Do not repeat an already posted
            diagnosis; keep the response short and actionable.
            Focus on Vulkan, AMD RX 6600, shader compilers, cache lifetimes,
            synchronization, performance and regressions.
            Reply in technical English, ending with a short Italian summary.
          claude_args: |
            --max-turns 6
            --allowedTools Read,Glob,Grep
